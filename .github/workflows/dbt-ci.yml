name: Deploy dbt Project

on:
  pull_request:
    types: [closed]
    branches:
      - dev
      - prod
  push:
    branches:
      - dev
      - prod

jobs:
  deploy_data_environment:

    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)

    runs-on: ubuntu-latest

    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"


      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install dbt-core dbt-snowflake


      # Define environment BEFORE running dbt
      - name: Set environment
        run: |
          TARGET_BRANCH="${GITHUB_BASE_REF:-${GITHUB_REF#refs/heads/}}"

          if [[ $TARGET_BRANCH == "dev" ]]; then
            echo "DEPLOY_ENV=dev" >> $GITHUB_ENV
          elif [[ $TARGET_BRANCH == "prod" ]]; then
            echo "DEPLOY_ENV=prod" >> $GITHUB_ENV
          else
            echo "Unexpected branch: $TARGET_BRANCH"
            exit 1
          fi


      - name: Install dbt dependencies
        run: dbt deps


      - name: Validate dbt project
        run: dbt debug --target $DEPLOY_ENV


      - name: Run dbt build
        run: dbt build --target dev


      - name: Upload dbt artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dbt-artifacts
          path: target/